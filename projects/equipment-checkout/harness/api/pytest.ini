# Frozen at the S1 freeze. Read-only to every builder, S1's own included.
#
# Passed explicitly with -c, so api/pyproject.toml is never consulted for test
# configuration: whatever the builder puts there cannot change how its own exam
# is run. --rootdir api fixes the rootdir the report paths are relative to;
# "app" is made importable by PYTHONPATH in command C3, not by rootdir.
[pytest]
addopts = --strict-markers --strict-config -p no:cacheprovider -ra
python_files = test_*.py
python_classes = Test*
python_functions = test_*
junit_family = xunit2
junit_logging = no
junit_duration_report = call
xfail_strict = true
filterwarnings =
    error
markers =
    row(id): the eval-plan row this case verifies
